<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadid Animart</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<!-- 🎥 VIDEO BACKGROUND -->
<video id="bgVideo" autoplay muted playsinline></video>
<div class="video-overlay"></div>

<!-- NAVBAR -->
<nav class="navbar glass">
    <div class="logo">Shadid<span>Animart</span></div>

    <div class="nav-right">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">EN</option>
            <option value="bn">BN</option>
        </select>

        <select id="currencySelect" onchange="changeCurrency()">
            <option value="USD">USD</option>
            <option value="BDT">BDT</option>
        </select>
    </div>
</nav>

<!-- HERO -->
<header class="hero video-hero">
    <div class="container">
        <h1 data-translate="hero.title"></h1>
        <p data-translate="hero.subtitle"></p>
        <button onclick="scrollToDeals()" data-translate="hero.cta"></button>
    </div>
</header>

<!-- PRODUCTS -->
<section id="deals">
    <h2 data-translate="deals.title"></h2>
    <div id="productsGrid"></div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content glass">
        <span onclick="closeModal()">×</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
