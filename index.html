<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shadid Animart - Your trusted affiliate hub. Discover best deals from Amazon, Alibaba, AliExpress and earn commissions.">
    <meta name="keywords" content="shadid animart, affiliate marketing, amazon affiliate, alibaba deals, earn money online, best deals bangladesh">
    <title>Shadid Animart | Best Deals from Amazon, Alibaba & More</title>
    <link rel="canonical" href="https://shadidanimart.com/">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="https://via.placeholder.com/64/0ea5e9/ffffff?text=SA">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">Shadid<span>Animart</span></div>

            <div class="nav-menu">
                <a href="#deals" data-translate="nav.deals">Best Deals</a>
                <a href="#categories" data-translate="nav.categories">Categories</a>
                <a href="#blog" data-translate="nav.blog">Blog</a>
            </div>

            <div class="nav-right">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">🇬🇧 English</option>
                    <option value="bn">🇧🇩 বাংলা</option>
                </select>

                <select id="currencySelect" onchange="changeCurrency()">
                    <option value="USD">USD</option>
                    <option value="BDT">BDT</option>
                </select>

                <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>

                <button class="btn-primary">Join My Affiliate Team</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="container">
            <h1 data-translate="hero.title">Smart Shopping.<br>Smart Earning.</h1>
            <p data-translate="hero.subtitle">Curated best deals from Amazon, Alibaba, AliExpress & more. Shop smart and earn commissions with me.</p>
            <button onclick="scrollToDeals()" class="btn-primary large" data-translate="hero.cta">Explore Deals</button>
        </div>
    </header>

    <!-- DEALS SECTION -->
    <section id="deals" class="section">
        <div class="container">
            <h2 data-translate="deals.title">Trending Deals - Amazon & Alibaba</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </section>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
