<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadid Animart</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<!-- 🎥 VIDEO BACKGROUND -->
<video id="bgVideo" autoplay muted playsinline></video>

<!-- NAV -->
<nav class="navbar glass">
    <div class="logo">Shadid<span>Animart</span></div>

    <div class="nav-right">
        <select id="currencySelect" onchange="changeCurrency()">
            <option value="USD">$ USD</option>
            <option value="BDT">৳ BDT</option>
        </select>
    </div>
</nav>

<!-- HERO -->
<header class="hero">
    <h1>Level Up Your Collection</h1>
    <p>Anime Figures • Cosplay • Affiliate Deals</p>
    <button onclick="scrollToDeals()">Enter Shop</button>
</header>

<!-- PRODUCTS -->
<section id="deals">
    <h2>🔥 Trending Anime Deals</h2>
    <div id="productsGrid"></div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content glass">
        <span onclick="closeModal()">×</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
