<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AetherDeals - Premium Affiliate Marketplace. Earn up to 40% commission promoting top tech, gadgets & lifestyle products.">
    <meta name="keywords" content="affiliate marketing, high commission, earn money online, tech affiliate, best affiliate programs">
    <meta name="author" content="AetherDeals">
    <title>AetherDeals | Premium Affiliate Marketplace - Earn Smart</title>
    <link rel="canonical" href="https://aetherdeals.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="AetherDeals | Premium Affiliate Marketplace">
    <meta property="og:description" content="Join the highest paying affiliate program. Promote premium products and earn up to 40% commission.">
    <meta property="og:image" content="https://picsum.photos/id/1015/1200/630">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" href="https://via.placeholder.com/64/0ea5e9/fff?text=AD">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">Aether<span>Deals</span></div>

            <div class="nav-menu">
                <a href="#deals" data-translate="nav.deals">Best Deals</a>
                <a href="#categories" data-translate="nav.categories">Categories</a>
                <a href="#blog" data-translate="nav.blog">Blog</a>
            </div>

            <div class="nav-right">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">🇬🇧 English</option>
                    <option value="bn">🇧🇩 বাংলা</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                </select>

                <select id="currencySelect" onchange="changeCurrency()">
                    <option value="USD">USD</option>
                    <option value="BDT">BDT</option>
                    <option value="EUR">EUR</option>
                </select>

                <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>

                <button class="btn-primary">Join as Affiliate</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="container">
            <h1 data-translate="hero.title">Earn Smart.<br>Shop Smarter.</h1>
            <p data-translate="hero.subtitle">Discover premium products with the highest affiliate commissions. Trusted by thousands of creators.</p>
            <button onclick="scrollToDeals()" class="btn-primary large" data-translate="hero.cta">Browse Deals</button>
        </div>
    </header>

    <!-- DEALS SECTION -->
    <section id="deals" class="section">
        <div class="container">
            <h2 data-translate="deals.title">Trending High Commission Deals</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </section>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
